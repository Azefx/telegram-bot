<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>Rayo Bot - تسجيل دخول</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-900 flex items-center justify-center h-screen"><div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96">
<h1 class="text-2xl text-white font-bold mb-6 text-center">لوحة تحكم Rayo 🤖</h1>
{% if error %}<p class="bg-red-500 text-white p-2 rounded mb-4 text-center">{{ error }}</p>{% endif %}
<form method="POST"><input type="password" name="password" placeholder="الباسورد" class="w-full p-3 rounded bg-gray-700 text-white mb-4" required>
<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded font-bold">دخول</button></form></div></body></html>
