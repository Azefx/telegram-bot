<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>الأكواد</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-900 text-white"><nav class="bg-gray-800 p-4 flex justify-between"><h1 class="text-xl font-bold">🤖 abdulrahman Bot v6.0</h1>
<div><a href="/" class="mx-2 hover:text-blue-400">الرئيسية</a><a href="/groups" class="mx-2 hover:text-blue-400">الجروبات</a><a href="/codes" class="mx-2 hover:text-blue-400">الأكواد</a><a href="/logout" class="mx-2 text-red-400">خروج</a></div></nav>
<div class="container mx-auto p-6"><h1 class="text-2xl font-bold mb-6">أكواد التفعيل</h1><div class="bg-gray-800 p-6 rounded-lg overflow-x-auto">
<table class="w-full"><thead><tr class="text-gray-400 text-right"><th class="p-3">الكود</th><th class="p-3">الخطة</th><th class="p-3">الحالة</th><th class="p-3">استخدم في</th><th class="p-3">تاريخ الإنشاء</th></tr></thead><tbody>
{% for c in codes %}<tr class="border-t border-gray-700"><td class="p-3 font-mono">{{ c.code }}</td><td class="p-3">{{ plans[c.plan]['name'] }}</td>
<td class="p-3">{% if c.is_used %}<span class="bg-green-600 px-2 py-1 rounded text-sm">مستخدم</span>{% else %}<span class="bg-blue-600 px-2 py-1 rounded text-sm">جديد</span>{% endif %}</td>
<td class="p-3">{{ c.used_by or '-' }}</td><td class="p-3">{{ c.created_at.strftime('%Y-%m-%d') }}</td></tr>{% endfor %}</tbody></table></div></div></body></html>
